version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenloop
      POSTGRES_USER: greenloop
      POSTGRES_PASSWORD: greenloop_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # MQTT broker for smart bin communication
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://greenloop:greenloop_dev@postgres:5432/greenloop
      JWT_SECRET: dev-secret-change-in-production
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      CV_SERVICE_URL: http://cv-service:5000
    depends_on:
      - postgres
      - mosquitto

  # Frontend (Next.js)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend

  # Computer Vision microservice
  cv-service:
    build:
      context: ../../cv-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"

  # IoT Gateway
  iot-gateway:
    build:
      context: ../../iot-gateway
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      BACKEND_WEBHOOK_URL: http://backend:4000/api/smartbins/webhook/bin-event
    depends_on:
      - mosquitto
      - backend

volumes:
  pgdata:
